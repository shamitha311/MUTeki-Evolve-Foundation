[project]
name = "muteki-evolve"
version = "0.1.0"
description = "Project-owned contracts and deterministic mocks for MUTeki-Evolve"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "muteki_adapter*", "orchestration*"]

